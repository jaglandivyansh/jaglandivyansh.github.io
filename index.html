function toast(msg, color) {
  var t = document.createElement("div");
  t.className = "toast";
  t.innerText = msg;
  document.getElementById("tc").appendChild(t);
  
  t.animate([
    { opacity: 0, transform: 'translate(-50%, 20px)' },
    { opacity: 1, transform: 'translate(-50%, 0)' }
  ], { duration: 300, easing: 'cubic-bezier(0.4,0,0.2,1)' });

  setTimeout(function(){ 
    var anim = t.animate([
      { opacity: 1, transform: 'translate(-50%, 0)' },
      { opacity: 0, transform: 'translate(-50%, 20px)' }
    ], { duration: 300, easing: 'ease' });
    
    anim.onfinish = () => t.remove();
  }, 3000);
}

window.openDrawer = function() {
  var drawer = document.getElementById('nb-mobile-drawer');
  var overlay = document.getElementById('nb-mobile-overlay');
  var hamburger = document.getElementById('nb-hamburger');
  if(drawer) drawer.classList.add('open');

  if(hamburger) hamburger.classList.add('active');
  if (typeof updateInstallDrawerItem === 'function') updateInstallDrawerItem();
};

window.closeDrawer = function() {
  var drawer = document.getElementById('nb-mobile-drawer');
  var overlay = document.getElementById('nb-mobile-overlay');
  var hamburger = document.getElementById('nb-hamburger');
  if(drawer) drawer.classList.remove('open');
  if(overlay) overlay.classList.remove('open');
  if(hamburger) hamburger.classList.remove('active');
};

window.toggleDrawer = function() {
  var drawer = document.getElementById('nb-mobile-drawer');
  if(drawer && drawer.classList.contains('open')) {
    window.closeDrawer();
  } else {

  }
};

// ── QD CACHE: load last-known-good question bank instantly ──
// Prevents a blank/empty quiz on cold start when the network is
// slow or a sheet fetch fails. The live fetch below still runs
// in the background and overwrites this with fresh data subject
// by subject, so users always end up on the latest questions —
// they just never have to stare at "0 questions" while waiting.
const QD_CACHE_KEY = "studylab_qd_cache_v1";

function loadCachedQD() {
  try {
    const raw = localStorage.getItem(QD_CACHE_KEY);
    if (!raw) return;
    const cached = JSON.parse(raw);
    if (cached && typeof cached === "object") {
      window.QD = cached;
      console.log("Loaded cached question bank (" +
        Object.values(cached).reduce((s, a) => s + (a ? a.length : 0), 0) +
        " questions) while live data loads.");
    }
  } catch (e) {
    console.warn("Could not read cached question bank:", e);
  }
}

function saveCachedQD() {
  try {
    localStorage.setItem(QD_CACHE_KEY, JSON.stringify(window.QD));
  } catch (e) {
    console.warn("Could not cache question bank (storage full or blocked):", e);
  }
}

loadCachedQD();

    { subject: "Computer", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcBWlFTv2n-_i5YFQZNee2YF9ACG0cn6SjCEYfwkp2518wfJJx7-VMPSv_dXNKtS5cst0S8u3FRlHA/pub?gid=1848882518&single=true&output=csv" },
    { subject: "Art & Culture", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcBWlFTv2n-_i5YFQZNee2YF9ACG0cn6SjCEYfwkp2518wfJJx7-VMPSv_dXNKtS5cst0S8u3FRlHA/pub?gid=1479607629&single=true&output=csv" },
    { subject: "Sports", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcBWlFTv2n-_i5YFQZNee2YF9ACG0cn6SjCEYfwkp2518wfJJx7-VMPSv_dXNKtS5cst0S8u3FRlHA/pub?gid=1637380538&single=true&output=csv" },
    { subject: "Miscellaneous", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcBWlFTv2n-_i5YFQZNee2YF9ACG0cn6SjCEYfwkp2518wfJJx7-VMPSv_dXNKtS5cst0S8u3FRlHA/pub?gid=1818113994&single=true&output=csv" }
  ];

  let completedRequests = 0;
  let failedSubjects = [];

  // ── SINGLE source of truth for "are we done yet?" ──
  // Called after EVERY request finishes, success or failure.
  // initializeApp() fires exactly once, the moment all requests
  // have settled — regardless of how many failed.
  function checkAllDone() {
    if (completedRequests === SHEET_SOURCES.length) {
      if (failedSubjects.length > 0) {
        console.warn("Sheets that failed to load:", failedSubjects.join(", "));
        if (typeof toast === 'function') {
          toast("Some subjects failed to load: " + failedSubjects.join(", "), "#f59e0b");
        } else {
          alert("Some sheets failed to load: " + failedSubjects.join(", ") + ". Please check your internet connection.");
        }
      }
      window.totalQuestions = Object.values(window.QD).reduce((sum, arr) => sum + arr.length, 0);
      saveCachedQD();
      initializeApp();
    }
  }

  // ── Safety net: if any single sheet hangs (slow network, dead
  // link, etc.) for more than 15s, treat it as failed instead of
  // blocking the whole app forever. ──
  const PER_SHEET_TIMEOUT_MS = 15000;

  SHEET_SOURCES.forEach(function(source) {
    let settled = false;
    let uniqueTimestamp = new Date().getTime();
    let freshUrl = source.url + "&nocache=" + uniqueTimestamp;
    let subject = source.subject;

    let timeoutId = setTimeout(function() {
      if (settled) return;
      settled = true;
      console.error("Timed out fetching sheet for subject:", subject);
      failedSubjects.push(subject);
      // Keep whatever was already loaded from cache for this subject
      // rather than wiping it to an empty array.
      if (!window.QD[subject]) window.QD[subject] = [];
      completedRequests++;
      checkAllDone();
    }, PER_SHEET_TIMEOUT_MS);

    Papa.parse(freshUrl, {
      download: true, header: true, skipEmptyLines: true,
      complete: function(results) {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);

        // Fresh data always replaces cached data for this subject
        // (cache is only a fallback for when the live fetch fails).
        window.QD[subject] = [];
        results.data.forEach(function(row) {
          if (!row["Question"]) return;
          window.QD[subject].push({
            q: row["Question"],
            o: [row["Option A"], row["Option B"], row["Option C"], row["Option D"]],
            a: parseInt(row["Correct Answer"]) - 1,
            topic: row["Topic"] ? row["Topic"].trim() : ""
          });
        });
        completedRequests++;
        checkAllDone();
      },
      error: function(err) {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);

        console.error("Error fetching/parsing sheet for subject:", subject, err);
        failedSubjects.push(subject);
        // Keep whatever was already loaded from cache for this subject
        // rather than wiping it to an empty array.
        if (!window.QD[subject]) window.QD[subject] = [];
        completedRequests++;
        checkAllDone();
      }
    });
  });
}

// ═══════════════════════════════════════════════════════
// FETCH PUBLISHED READING NOTES FROM SHEET (via Apps Script)
// Runs BEFORE fetchQuestionsAndStart(), merging published
// sheet content on top of window.RD (from reading-data.js).
// Sheet-published topics override any same-named static topic;
// anything not republished keeps working exactly as before.
// ═══════════════════════════════════════════════════════
const NOTES_ADMIN_URL = "https://script.google.com/macros/s/AKfycbzVYzrJl9L0B_FHg0sDtM5gAjDs10xZmiKBlXRUojTE0z9UBQrtOwKAhIQBC_MQ_gdTKg/exec";
const NOTES_FETCH_TIMEOUT_MS = 10000;

function fetchPublishedNotes(done) {
  let settled = false;
  let timeoutId = setTimeout(function() {
    if (settled) return;
    settled = true;
    console.warn("Timed out fetching published notes — using reading-data.js only.");
    done();
  }, NOTES_FETCH_TIMEOUT_MS);

  fetch(NOTES_ADMIN_URL + "?status=Published&nocache=" + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);

      if (!Array.isArray(rows)) { done(); return; }
      if (typeof window.RD === 'undefined') window.RD = {};

      // Group rows by Subject → Topic → Language, ordered by OrderIndex
      const grouped = {};
      rows.forEach(function(row) {
        const subj = row.Subject, topic = row.Topic, lang = row.Language;
        if (!subj || !topic || !lang) return;
        if (!grouped[subj]) grouped[subj] = {};
        if (!grouped[subj][topic]) grouped[subj][topic] = {};
        if (!grouped[subj][topic][lang]) grouped[subj][topic][lang] = [];
        grouped[subj][topic][lang].push({
          type: row.Type,
          text: row.Text,
          order: Number(row.OrderIndex) || 0
        });
      });

      // Sort each language's blocks by order, strip the helper field,
      // then merge into window.RD (sheet-published topics override
      // any same-named static topic from reading-data.js).
      Object.keys(grouped).forEach(function(subj) {
        if (!window.RD[subj]) window.RD[subj] = {};
        Object.keys(grouped[subj]).forEach(function(topic) {
          const merged = { hi: [], en: [] };
          ["hi", "en"].forEach(function(lang) {
            const arr = grouped[subj][topic][lang] || [];
            arr.sort(function(a, b) { return a.order - b.order; });
            merged[lang] = arr.map(function(b) { return { type: b.type, text: b.text }; });
          });
          window.RD[subj][topic] = merged;
        });
      });

      done();
    })
    .catch(function(err) {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      console.warn("Error fetching published notes — using reading-data.js only:", err);
      done();
    });
}

function fetchAllAndStart() {
  fetchPublishedNotes(function() {
    fetchQuestionsAndStart();
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', fetchAllAndStart);
} else {
  fetchAllAndStart();
}
</script>

<!-- ── SWIPE NAVIGATION ENGINE ── -->
<style>
#sl-page-dots { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; z-index: 9000; pointer-events: none; opacity: 0; transition: opacity 0.35s ease; }
#sl-page-dots.visible { opacity: 1; }
#sl-page-dots .sl-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.22); transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1); }
#sl-page-dots .sl-dot.active { width: 20px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
</style>

<script>
(function () {
  var NAV_PAGES = ['home', 'shorts', 'daily'];
  var EDGE_ZONE = 28;  
  var SWIPE_MIN = 48;  
  var TIME_MAX  = 400; 
  var _swipeLock = false; 

  var bar = document.createElement('div');
  bar.id = 'sl-page-dots';
  NAV_PAGES.forEach(function () {
    var d = document.createElement('div');
    d.className = 'sl-dot';
    bar.appendChild(d);
  });
  document.body.appendChild(bar);

  var _dotTimer = null;
  function showDots(page) {
    var idx = NAV_PAGES.indexOf(page);
    if (idx === -1) { bar.classList.remove('visible'); return; }
    bar.classList.add('visible');
    bar.querySelectorAll('.sl-dot').forEach(function (d, i) { d.classList.toggle('active', i === idx); });
    clearTimeout(_dotTimer);
    _dotTimer = setTimeout(function () { bar.classList.remove('visible'); }, 2000);
  }

  var _lastPage = null;
  setInterval(function () {
    var p = window.currentPage || 'home';
    if (p !== _lastPage) { _lastPage = p; showDots(p); }
  }, 100);

  var sx = 0, sy = 0, st = 0;
  var locked = false, isEdge = false, edgeSide = '';

  document.addEventListener('touchstart', function (e) {
    var t = e.touches[0];
    sx = t.clientX; sy = t.clientY; st = Date.now();
    locked = false; isEdge = false; edgeSide = '';
    _swipeLock = false;
    var W = window.innerWidth;
    if (sx < EDGE_ZONE)         { isEdge = true; edgeSide = 'left'; }
    else if (sx > W - EDGE_ZONE){ isEdge = true; edgeSide = 'right'; }
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (locked) return;
    var dx = Math.abs(e.touches[0].clientX - sx);
    var dy = Math.abs(e.touches[0].clientY - sy);
    if (dy > 10 && dy > dx * 1.5) locked = true;
  }, { passive: true });

  document.addEventListener('touchend', function (e) {
    if (locked || _swipeLock) return;
    var t   = e.changedTouches[0];
    var dx  = t.clientX - sx;
    var dy  = t.clientY - sy;
    var dt  = Date.now() - st;
    var adx = Math.abs(dx);
    var ady = Math.abs(dy);

    if (dt  > TIME_MAX)      return; 
    if (adx < SWIPE_MIN)     return; 
    if (ady / adx > 0.65)   return; 

    _swipeLock = true; 

    var drawerOpen = document.getElementById('nb-mobile-drawer') && document.getElementById('nb-mobile-drawer').classList.contains('open');

    // 1. Close drawer with left swipe
    if (drawerOpen && dx < 0) { window.closeDrawer(); return; }

    // 2. Open drawer with right-edge left swipe
    if (isEdge && edgeSide === 'right' && dx < 0) {
      window.openDrawer(); return;
    }

    // 3. Go back with left-edge right swipe
    if (isEdge && edgeSide === 'left' && dx > 0) {
      if (typeof go === 'function') {
        // If they are deep in the app, safely route them back to home
        if (window.currentPage && window.currentPage !== 'home') {
            go('home'); 
        } else {
            // If they are already on home, trigger native back (which fires your exit modal)
            window.history.back(); 
        }
      }
      return;
    }

    // 4. Regular page swipe
    var page = window.currentPage || 'home';
    var idx  = NAV_PAGES.indexOf(page);
    if (idx === -1) return; 

    if (dx < 0 && idx < NAV_PAGES.length - 1) {
      var next = NAV_PAGES[idx + 1];
      showDots(next);
      if (typeof go === 'function') go(next);
    } else if (dx > 0 && idx > 0) {
      var prev = NAV_PAGES[idx - 1];
      showDots(prev);
      if (typeof go === 'function') go(prev);
    }
  }, { passive: true });

})();
</script>
